name: CI

on:
  push:
  pull_request:

env:
  GODOT_VERSION: "4.7.2"

jobs:
  data:
    name: Content data (JSON Schema + references)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements.txt
      - run: python tools/validate_data.py
      - run: python -m unittest discover -s tools/tests -v

  web-preview:
    name: Web preview (JS port parity with GDScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: node web_preview/parity_check.js
      - run: python tools/build_web_preview.py --check

  lint:
    name: GDScript lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements.txt
      - run: gdformat --check game/
      - run: gdlint game/

  godot-tests:
    name: Godot headless tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux
      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip
          mv Godot_v*_linux.x86_64 godot
      - name: Import project (registers class_name scripts)
        run: ~/godot/godot --headless --path game --import
      - name: Run tests
        run: ~/godot/godot --headless --path game -s res://tests/run_tests.gd
